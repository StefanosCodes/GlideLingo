name: Deploy development API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - content/**
      - .dockerignore
      - .github/workflows/deploy-development-api.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-development-api
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: glidelingo-development
  GCP_REGION: ${{ vars.GCP_REGION || 'us-west1' }}
  GCP_REPOSITORY: glidelingo-containers
  GCP_SERVICE: glidelingo-api
  IMAGE_NAME: glidelingo-api
  CLERK_ISSUER: https://vast-gator-9531.clerk.accounts.dev
  CLERK_JWKS_URL: https://vast-gator-9531.clerk.accounts.dev/.well-known/jwks.json
  CLERK_AUTHORIZED_PARTIES: '["http://localhost:8081","http://127.0.0.1:8081","glidelingo://app"]'

jobs:
  deploy:
    name: Verify, build, deploy, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: development

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          python-version: "3.13"
          working-directory: backend

      - name: Verify backend
        run: npm run setup:backend && npm run api:verify

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - id: image
        name: Build and push immutable image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build --file backend/Dockerfile --tag "${image_tag}" .
          docker push "${image_tag}"
          digest="$(gcloud artifacts docker images describe "${image_tag}" --format='value(image_summary.digest)')"
          echo "uri=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/${IMAGE_NAME}@${digest}" >> "${GITHUB_OUTPUT}"

      - id: rollout
        name: Deploy, smoke, and promote Cloud Run revision
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag="candidate-${GITHUB_SHA::12}"
          service_json="$(gcloud run services describe "${GCP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json)"
          initial_generation="$(jq -r '.metadata.generation // empty' <<< "${service_json}")"
          initial_observed_generation="$(jq -r '.status.observedGeneration // empty' <<< "${service_json}")"
          previous_revision="$(jq -r \
            '[.status.traffic[]? | select((.percent // 0) == 100)] | if length == 1 then (.[0].revisionName // "") else "" end' \
            <<< "${service_json}")"
          service_url="$(jq -r '.status.url // empty' <<< "${service_json}")"

          if [[ ! "${initial_generation}" =~ ^[1-9][0-9]*$ \
            || "${initial_observed_generation}" != "${initial_generation}" \
            || -z "${previous_revision}" \
            || -z "${service_url}" ]]; then
            echo "The Cloud Run service must be stable with exactly one resolved revision serving 100% before deployment." >&2
            exit 1
          fi

          cleanup_candidate_tag() {
            gcloud run services update-traffic "${GCP_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --remove-tags="${candidate_tag}" \
              --quiet >/dev/null 2>&1 || true
          }
          rollback() {
            gcloud run services update-traffic "${GCP_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --to-revisions="${previous_revision}=100" \
              --quiet
          }
          smoke() {
            local url="$1"
            curl --fail --retry 6 --retry-all-errors --retry-delay 5 "${url}/health/live" \
              || return 1
            curl --fail --retry 6 --retry-all-errors --retry-delay 5 "${url}/health/ready" \
              || return 1
            local auth_status
            auth_status="$(curl --silent --show-error --output /dev/null \
              --header 'Authorization: Bearer invalid-deployment-smoke-token' \
              --write-out '%{http_code}' \
              "${url}/v1/auth/session")" \
              || return 1
            if [[ "${auth_status}" != "401" ]]; then
              echo "Expected configured authentication to reject an invalid token with 401; received ${auth_status}." >&2
              return 1
            fi
          }
          trap cleanup_candidate_tag EXIT

          gcloud run deploy "${GCP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${{ steps.image.outputs.uri }}" \
            --update-env-vars="^@^GLIDELINGO_CLERK_ISSUER=${CLERK_ISSUER}@GLIDELINGO_CLERK_JWKS_URL=${CLERK_JWKS_URL}@GLIDELINGO_CLERK_AUTHORIZED_PARTIES=${CLERK_AUTHORIZED_PARTIES}" \
            --no-traffic \
            --tag="${candidate_tag}" \
            --quiet

          candidate_json="$(gcloud run services describe "${GCP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json)"
          staged_generation="$(jq -r '.metadata.generation // empty' <<< "${candidate_json}")"
          staged_observed_generation="$(jq -r '.status.observedGeneration // empty' <<< "${candidate_json}")"
          staged_previous_revision="$(jq -r \
            '[.status.traffic[]? | select((.percent // 0) == 100)] | if length == 1 then (.[0].revisionName // "") else "" end' \
            <<< "${candidate_json}")"
          candidate_traffic="$(jq -c --arg tag "${candidate_tag}" \
            '[.status.traffic[]? | select(.tag == $tag)] | if length == 1 then .[0] else empty end' \
            <<< "${candidate_json}")"
          candidate_revision="$(jq -r '.revisionName // empty' <<< "${candidate_traffic}")"
          candidate_url="$(jq -r '.url // empty' <<< "${candidate_traffic}")"
          candidate_percent="$(jq -r '.percent // 0' <<< "${candidate_traffic}")"
          expected_staged_generation="$((10#${initial_generation} + 1))"

          if [[ "${staged_generation}" != "${expected_staged_generation}" \
            || "${staged_observed_generation}" != "${staged_generation}" \
            || "${staged_previous_revision}" != "${previous_revision}" \
            || -z "${candidate_revision}" \
            || -z "${candidate_url}" \
            || "${candidate_percent}" != "0" ]]; then
            echo "Cloud Run did not produce exactly one stable zero-traffic candidate generation while preserving the previous 100% revision." >&2
            exit 1
          fi

          previous_revision_json="$(gcloud run revisions describe "${previous_revision}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json)"
          candidate_revision_json="$(gcloud run revisions describe "${candidate_revision}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json)"
          previous_revenuecat_raw="$(jq -r \
            '[.spec.containers[0].env[]? | select(.name == "GLIDELINGO_REVENUECAT_ENABLED")] | if length == 1 then (.[0].value // "") else "" end' \
            <<< "${previous_revision_json}")"
          candidate_revenuecat_raw="$(jq -r \
            '[.spec.containers[0].env[]? | select(.name == "GLIDELINGO_REVENUECAT_ENABLED")] | if length == 1 then (.[0].value // "") else "" end' \
            <<< "${candidate_revision_json}")"
          if [[ "${previous_revenuecat_raw}" != "true" && "${previous_revenuecat_raw}" != "false" ]]; then
            echo "Refusing deployment because the 100%-serving revision must explicitly set GLIDELINGO_REVENUECAT_ENABLED to literal true or false." >&2
            exit 1
          fi
          if [[ "${candidate_revenuecat_raw}" != "true" && "${candidate_revenuecat_raw}" != "false" ]]; then
            echo "Refusing deployment because the candidate revision must explicitly set GLIDELINGO_REVENUECAT_ENABLED to literal true or false." >&2
            exit 1
          fi
          if [[ "${previous_revenuecat_raw}" != "${candidate_revenuecat_raw}" ]]; then
            echo "Refusing ordinary deployment because the 100%-serving revision and candidate have different RevenueCat activation states." >&2
            echo "Use ./infra/gcp/scripts/activate-revenuecat-development.sh for the reviewed billing activation procedure." >&2
            exit 1
          fi

          smoke "${candidate_url}"

          prepromotion_json="$(gcloud run services describe "${GCP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json)"
          prepromotion_generation="$(jq -r '.metadata.generation // empty' <<< "${prepromotion_json}")"
          prepromotion_observed_generation="$(jq -r '.status.observedGeneration // empty' <<< "${prepromotion_json}")"
          prepromotion_previous_revision="$(jq -r \
            '[.status.traffic[]? | select((.percent // 0) == 100)] | if length == 1 then (.[0].revisionName // "") else "" end' \
            <<< "${prepromotion_json}")"
          prepromotion_service_url="$(jq -r '.status.url // empty' <<< "${prepromotion_json}")"
          prepromotion_candidate_traffic="$(jq -c --arg tag "${candidate_tag}" \
            '[.status.traffic[]? | select(.tag == $tag)] | if length == 1 then .[0] else empty end' \
            <<< "${prepromotion_json}")"
          prepromotion_candidate_revision="$(jq -r '.revisionName // empty' <<< "${prepromotion_candidate_traffic}")"
          prepromotion_candidate_url="$(jq -r '.url // empty' <<< "${prepromotion_candidate_traffic}")"
          prepromotion_candidate_percent="$(jq -r '.percent // 0' <<< "${prepromotion_candidate_traffic}")"
          prepromotion_revenuecat_raw="$(jq -r \
            '[(.spec.template.spec.containers[0].env // .spec.template.containers[0].env // [])[]? | select(.name == "GLIDELINGO_REVENUECAT_ENABLED")] | if length == 1 then (.[0].value // "") else "" end' \
            <<< "${prepromotion_json}")"

          if [[ "${prepromotion_revenuecat_raw}" != "true" && "${prepromotion_revenuecat_raw}" != "false" ]]; then
            echo "Refusing promotion because the current service template has no exact literal true/false RevenueCat activation state." >&2
            exit 1
          fi
          if [[ "${prepromotion_generation}" != "${staged_generation}" \
            || "${prepromotion_observed_generation}" != "${staged_generation}" \
            || "${prepromotion_previous_revision}" != "${previous_revision}" \
            || "${prepromotion_service_url}" != "${service_url}" \
            || "${prepromotion_candidate_revision}" != "${candidate_revision}" \
            || "${prepromotion_candidate_url}" != "${candidate_url}" \
            || "${prepromotion_candidate_percent}" != "0" \
            || "${prepromotion_revenuecat_raw}" != "${candidate_revenuecat_raw}" ]]; then
            echo "Refusing promotion because Cloud Run generation, traffic, candidate tag, URL, or RevenueCat state drifted after staging." >&2
            exit 1
          fi

          if ! gcloud run services update-traffic "${GCP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --to-revisions="${candidate_revision}=100" \
            --quiet; then
            rollback
            exit 1
          fi

          if ! smoke "${service_url}"; then
            rollback
            exit 1
          fi

          echo "revision=${candidate_revision}" >> "${GITHUB_OUTPUT}"
          echo "url=${service_url}" >> "${GITHUB_OUTPUT}"
