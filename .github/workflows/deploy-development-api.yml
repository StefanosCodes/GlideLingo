name: Deploy development API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - content/**
      - .dockerignore
      - .github/workflows/deploy-development-api.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-development-api
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: glidelingo-development
  GCP_REGION: ${{ vars.GCP_REGION || 'us-west1' }}
  GCP_REPOSITORY: glidelingo-containers
  GCP_SERVICE: glidelingo-api
  IMAGE_NAME: glidelingo-api

jobs:
  deploy:
    name: Verify, build, deploy, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: development

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          python-version: "3.13"
          working-directory: backend

      - name: Verify backend
        run: npm run setup:backend && npm run api:verify

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - id: image
        name: Build and push immutable image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build --file backend/Dockerfile --tag "${image_tag}" .
          docker push "${image_tag}"
          digest="$(gcloud artifacts docker images describe "${image_tag}" --format='value(image_summary.digest)')"
          echo "uri=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/${IMAGE_NAME}@${digest}" >> "${GITHUB_OUTPUT}"

      - id: rollout
        name: Deploy, smoke, and promote Cloud Run revision
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag="candidate-${GITHUB_SHA::12}"
          service_json="$(gcloud run services describe "${GCP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json)"
          previous_revision="$(jq -r '[.status.traffic[] | select(.percent == 100)][0].revisionName // empty' <<< "${service_json}")"
          service_url="$(jq -r '.status.url // empty' <<< "${service_json}")"

          if [[ -z "${previous_revision}" || -z "${service_url}" ]]; then
            echo "The Terraform-managed bootstrap revision must be serving 100% before deployment." >&2
            exit 1
          fi

          cleanup_candidate_tag() {
            gcloud run services update-traffic "${GCP_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --remove-tags="${candidate_tag}" \
              --quiet >/dev/null 2>&1 || true
          }
          rollback() {
            gcloud run services update-traffic "${GCP_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --to-revisions="${previous_revision}=100" \
              --quiet
          }
          smoke() {
            local url="$1"
            curl --fail --retry 6 --retry-all-errors --retry-delay 5 "${url}/health/live" \
              || return 1
            curl --fail --retry 6 --retry-all-errors --retry-delay 5 "${url}/health/ready" \
              || return 1
          }
          trap cleanup_candidate_tag EXIT

          gcloud run deploy "${GCP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${{ steps.image.outputs.uri }}" \
            --no-traffic \
            --tag="${candidate_tag}" \
            --quiet

          candidate_json="$(gcloud run services describe "${GCP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json)"
          candidate_traffic="$(jq -c --arg tag "${candidate_tag}" '[.status.traffic[] | select(.tag == $tag)][0] // empty' <<< "${candidate_json}")"
          candidate_revision="$(jq -r '.revisionName // empty' <<< "${candidate_traffic}")"
          candidate_url="$(jq -r '.url // empty' <<< "${candidate_traffic}")"

          if [[ -z "${candidate_revision}" || -z "${candidate_url}" ]]; then
            echo "Cloud Run did not expose the candidate revision and tag URL." >&2
            exit 1
          fi

          smoke "${candidate_url}"

          if ! gcloud run services update-traffic "${GCP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --to-revisions="${candidate_revision}=100" \
            --quiet; then
            rollback
            exit 1
          fi

          if ! smoke "${service_url}"; then
            rollback
            exit 1
          fi

          echo "revision=${candidate_revision}" >> "${GITHUB_OUTPUT}"
          echo "url=${service_url}" >> "${GITHUB_OUTPUT}"
