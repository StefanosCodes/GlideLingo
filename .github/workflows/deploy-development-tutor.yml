name: Deploy dormant development tutor

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-development-tutor
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: glidelingo-development
  GCP_REGION: ${{ vars.GCP_REGION || 'us-west1' }}
  GCP_REPOSITORY: glidelingo-containers
  GCP_SERVICE: glidelingo-lesson-tutor
  IMAGE_NAME: glidelingo-lesson-tutor

jobs:
  deploy:
    name: Verify, build, and deploy disabled revision
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: development

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
          working-directory: services/lesson-tutor

      - name: Verify private tutor
        run: npm run setup:tutor && npm run tutor:verify

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - id: image
        name: Build and push immutable image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build --file services/lesson-tutor/Dockerfile --tag "${image_tag}" .
          docker push "${image_tag}"
          digest="$(gcloud artifacts docker images describe "${image_tag}" --format='value(image_summary.digest)')"
          echo "uri=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/${IMAGE_NAME}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Deploy disabled revision
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "${GCP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json)"
          enabled="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name == "GLIDELINGO_TUTOR_ENABLED")][0].value // ""' <<< "${service_json}")"
          test "${enabled}" = "false"
          gcloud run deploy "${GCP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${{ steps.image.outputs.uri }}" \
            --no-traffic \
            --quiet
          revision_json="$(gcloud run services describe "${GCP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json)"
          latest_created="$(jq -r '.status.latestCreatedRevisionName // ""' <<< "${revision_json}")"
          latest_ready="$(jq -r '.status.latestReadyRevisionName // ""' <<< "${revision_json}")"
          test -n "${latest_created}"
          test "${latest_ready}" = "${latest_created}"
