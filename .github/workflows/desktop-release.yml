name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA already reviewed and reachable from main
        required: true
        type: string
      release_tag:
        description: Existing protected desktop-v<version> tag pointing to commit_sha
        required: true
        type: string
  push:
    tags:
      - desktop-v*

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate reviewed release commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit_sha: ${{ steps.selection.outputs.commit_sha }}
      release_tag: ${{ steps.selection.outputs.release_tag }}
      version: ${{ steps.selection.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: main
      - name: Fetch complete main history and protected release tags
        run: git fetch --force origin main:refs/remotes/origin/main --tags
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate release selection before secrets are available
        id: selection
        env:
          GLIDELINGO_EVENT_NAME: ${{ github.event_name }}
          GLIDELINGO_EVENT_SHA: ${{ github.sha }}
          GLIDELINGO_REF_NAME: ${{ github.ref_name }}
          GLIDELINGO_REF_TYPE: ${{ github.ref_type }}
          GLIDELINGO_SELECTED_COMMIT: ${{ inputs.commit_sha }}
          GLIDELINGO_SELECTED_TAG: ${{ inputs.release_tag }}
        run: node desktop/release-workflow.cjs validate-selection
      - name: Check out the validated release commit
        env:
          GLIDELINGO_RELEASE_COMMIT: ${{ steps.selection.outputs.commit_sha }}
        run: git checkout --detach "$GLIDELINGO_RELEASE_COMMIT"
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run verify

  sign:
    name: Sign, notarize, and stage macOS draft
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    environment: desktop-release-signing
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Revalidate release selection after environment approval
        env:
          GLIDELINGO_EVENT_NAME: workflow_dispatch
          GLIDELINGO_SELECTED_COMMIT: ${{ needs.validate.outputs.commit_sha }}
          GLIDELINGO_SELECTED_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          git fetch --force origin main:refs/remotes/origin/main --tags
          node desktop/release-workflow.cjs validate-selection
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Validate protected GCP release selectors
        env:
          GLIDELINGO_APPLE_APP_SPECIFIC_PASSWORD_SECRET_VERSION: ${{ vars.GLIDELINGO_APPLE_APP_SPECIFIC_PASSWORD_SECRET_VERSION }}
          GLIDELINGO_APPLE_ID_SECRET_VERSION: ${{ vars.GLIDELINGO_APPLE_ID_SECRET_VERSION }}
          GLIDELINGO_APPLE_TEAM_ID_SECRET_VERSION: ${{ vars.GLIDELINGO_APPLE_TEAM_ID_SECRET_VERSION }}
          GLIDELINGO_BILLING_MODE: ${{ vars.GLIDELINGO_BILLING_MODE }}
          GLIDELINGO_CLERK_PUBLISHABLE_KEY_SECRET_VERSION: ${{ vars.GLIDELINGO_CLERK_PUBLISHABLE_KEY_SECRET_VERSION }}
          GLIDELINGO_GCP_DESKTOP_RELEASE_SERVICE_ACCOUNT: ${{ vars.GLIDELINGO_GCP_DESKTOP_RELEASE_SERVICE_ACCOUNT }}
          GLIDELINGO_GCP_PROJECT_ID: ${{ vars.GLIDELINGO_GCP_PROJECT_ID }}
          GLIDELINGO_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GLIDELINGO_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GLIDELINGO_MACOS_CERTIFICATE_PASSWORD_SECRET_VERSION: ${{ vars.GLIDELINGO_MACOS_CERTIFICATE_PASSWORD_SECRET_VERSION }}
          GLIDELINGO_MACOS_CERTIFICATE_SECRET_VERSION: ${{ vars.GLIDELINGO_MACOS_CERTIFICATE_SECRET_VERSION }}
          GLIDELINGO_REVENUECAT_WEB_API_KEY_SECRET_VERSION: ${{ vars.GLIDELINGO_REVENUECAT_WEB_API_KEY_SECRET_VERSION }}
        run: node desktop/release-secrets.cjs
      - name: Authenticate to production GCP with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GLIDELINGO_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GLIDELINGO_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GLIDELINGO_GCP_DESKTOP_RELEASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true
      - name: Fetch pinned release inputs from GCP Secret Manager
        id: release_secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3
        with:
          secrets: |-
            macos_certificate_base64:${{ vars.GLIDELINGO_MACOS_CERTIFICATE_SECRET_VERSION }}
            macos_certificate_password:${{ vars.GLIDELINGO_MACOS_CERTIFICATE_PASSWORD_SECRET_VERSION }}
            apple_id:${{ vars.GLIDELINGO_APPLE_ID_SECRET_VERSION }}
            apple_app_specific_password:${{ vars.GLIDELINGO_APPLE_APP_SPECIFIC_PASSWORD_SECRET_VERSION }}
            apple_team_id:${{ vars.GLIDELINGO_APPLE_TEAM_ID_SECRET_VERSION }}
            clerk_publishable_key:${{ vars.GLIDELINGO_CLERK_PUBLISHABLE_KEY_SECRET_VERSION }}
            revenuecat_web_api_key:${{ vars.GLIDELINGO_REVENUECAT_WEB_API_KEY_SECRET_VERSION }}
      - name: Build signed and notarized universal app
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.release_secrets.outputs.apple_app_specific_password }}
          APPLE_ID: ${{ steps.release_secrets.outputs.apple_id }}
          APPLE_TEAM_ID: ${{ steps.release_secrets.outputs.apple_team_id }}
          CSC_KEY_PASSWORD: ${{ steps.release_secrets.outputs.macos_certificate_password }}
          CSC_LINK: ${{ steps.release_secrets.outputs.macos_certificate_base64 }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.GLIDELINGO_PRODUCTION_API_ORIGIN }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ steps.release_secrets.outputs.clerk_publishable_key }}
          EXPO_PUBLIC_REVENUECAT_WEB_API_KEY: ${{ steps.release_secrets.outputs.revenuecat_web_api_key }}
          GLIDELINGO_BILLING_MODE: ${{ vars.GLIDELINGO_BILLING_MODE }}
          GLIDELINGO_CLERK_ORIGIN: ${{ vars.GLIDELINGO_PRODUCTION_CLERK_ORIGIN }}
          GLIDELINGO_DESKTOP_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: npm run desktop:release
      - name: Verify signature, notarization, and architecture
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-universal/GlideLingo.app
          spctl --assess --type execute --verbose=4 release/mac-universal/GlideLingo.app
          xcrun stapler validate release/mac-universal/GlideLingo.app
          ARCHITECTURES="$(lipo -archs release/mac-universal/GlideLingo.app/Contents/MacOS/GlideLingo)"
          grep -qw x86_64 <<< "$ARCHITECTURES"
          grep -qw arm64 <<< "$ARCHITECTURES"
      - name: Create and verify the exact release assets
        run: |
          node desktop/release-workflow.cjs write-checksums release
          node desktop/release-workflow.cjs validate-assets release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GlideLingo-macOS-${{ needs.validate.outputs.commit_sha }}
          path: |
            release/GlideLingo-${{ needs.validate.outputs.version }}-universal.dmg
            release/GlideLingo-${{ needs.validate.outputs.version }}-universal.dmg.blockmap
            release/GlideLingo-${{ needs.validate.outputs.version }}-universal.zip
            release/GlideLingo-${{ needs.validate.outputs.version }}-universal.zip.blockmap
            release/latest-mac.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Converge the GitHub release to an exact draft
        env:
          GH_TOKEN: ${{ github.token }}
          GLIDELINGO_BILLING_MODE: ${{ vars.GLIDELINGO_BILLING_MODE }}
          GLIDELINGO_RELEASE_COMMIT: ${{ needs.validate.outputs.commit_sha }}
          GLIDELINGO_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: node desktop/release-workflow.cjs stage-draft release
