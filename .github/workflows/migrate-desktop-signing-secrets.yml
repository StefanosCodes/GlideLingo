name: ONE TIME - Migrate desktop signing secrets to GCP

on:
  workflow_dispatch:
    inputs:
      confirm_project_id:
        description: Type the exact isolated production project ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: migrate-desktop-signing-secrets
  cancel-in-progress: false

jobs:
  migrate:
    name: Copy legacy GitHub secrets into pinned GCP versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: desktop-release-signing
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GLIDELINGO_GCP_PROJECT_ID }}
    steps:
      - name: Validate immutable production scope
        shell: bash
        env:
          CONFIRMED_PROJECT_ID: ${{ inputs.confirm_project_id }}
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "${EXPECTED_REF}"
          test "${CONFIRMED_PROJECT_ID}" = "glidelingo-prod-50843312405"
          test "${GCP_PROJECT_ID}" = "${CONFIRMED_PROJECT_ID}"

      - name: Authenticate with the protected desktop release identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GLIDELINGO_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GLIDELINGO_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GLIDELINGO_GCP_DESKTOP_RELEASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify authenticated project
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project 2>/dev/null)" = "${GCP_PROJECT_ID}"

      - id: migrate
        name: Validate and copy the five legacy signing values
        shell: bash
        env:
          LEGACY_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          LEGACY_APPLE_ID: ${{ secrets.APPLE_ID }}
          LEGACY_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LEGACY_MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          LEGACY_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          for secret_name in \
            LEGACY_APPLE_APP_SPECIFIC_PASSWORD \
            LEGACY_APPLE_ID \
            LEGACY_APPLE_TEAM_ID \
            LEGACY_MACOS_CERTIFICATE_BASE64 \
            LEGACY_MACOS_CERTIFICATE_PASSWORD; do
            test -n "${!secret_name}"
          done
          [[ "${LEGACY_APPLE_ID}" == *@* ]]
          [[ "${LEGACY_APPLE_TEAM_ID}" =~ ^[A-Z0-9]{10}$ ]]

          certificate_file="$(mktemp "${RUNNER_TEMP}/glidelingo-signing-certificate.XXXXXX.p12")"
          cleanup() {
            rm -f -- "${certificate_file}"
          }
          trap cleanup EXIT INT TERM
          chmod 600 "${certificate_file}"
          printf '%s' "${LEGACY_MACOS_CERTIFICATE_BASE64}" | base64 --decode > "${certificate_file}"
          openssl pkcs12 \
            -in "${certificate_file}" \
            -passin env:LEGACY_MACOS_CERTIFICATE_PASSWORD \
            -noout >/dev/null 2>&1

          add_version() {
            local secret_id="$1"
            local source_name="$2"
            local output_name="$3"
            local secret_value="${!source_name}"
            local version_name
            local version

            version_name="$(
              printf '%s' "${secret_value}" |
                gcloud secrets versions add "${secret_id}" \
                  --project="${GCP_PROJECT_ID}" \
                  --data-file=- \
                  --format='value(name)'
            )"
            [[ "${version_name}" =~ /versions/([1-9][0-9]*)$ ]]
            version="${BASH_REMATCH[1]}"
            printf '%s=%s\n' "${output_name}" "${version}" >> "${GITHUB_OUTPUT}"
          }

          add_version \
            glidelingo-desktop-macos-certificate-base64 \
            LEGACY_MACOS_CERTIFICATE_BASE64 \
            macos_certificate_version
          add_version \
            glidelingo-desktop-macos-certificate-password \
            LEGACY_MACOS_CERTIFICATE_PASSWORD \
            macos_certificate_password_version
          add_version \
            glidelingo-desktop-apple-id \
            LEGACY_APPLE_ID \
            apple_id_version
          add_version \
            glidelingo-desktop-apple-app-specific-password \
            LEGACY_APPLE_APP_SPECIFIC_PASSWORD \
            apple_app_specific_password_version
          add_version \
            glidelingo-desktop-apple-team-id \
            LEGACY_APPLE_TEAM_ID \
            apple_team_id_version

      - name: Record non-secret pinned selectors
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD_VERSION: ${{ steps.migrate.outputs.apple_app_specific_password_version }}
          APPLE_ID_VERSION: ${{ steps.migrate.outputs.apple_id_version }}
          APPLE_TEAM_ID_VERSION: ${{ steps.migrate.outputs.apple_team_id_version }}
          MACOS_CERTIFICATE_PASSWORD_VERSION: ${{ steps.migrate.outputs.macos_certificate_password_version }}
          MACOS_CERTIFICATE_VERSION: ${{ steps.migrate.outputs.macos_certificate_version }}
        run: |
          set -euo pipefail
          for version in \
            "${APPLE_APP_SPECIFIC_PASSWORD_VERSION}" \
            "${APPLE_ID_VERSION}" \
            "${APPLE_TEAM_ID_VERSION}" \
            "${MACOS_CERTIFICATE_PASSWORD_VERSION}" \
            "${MACOS_CERTIFICATE_VERSION}"; do
            [[ "${version}" =~ ^[1-9][0-9]*$ ]]
          done
          {
            echo '## GCP signing secret migration'
            echo
            echo '| GitHub environment variable | Pinned Secret Manager selector |'
            echo '| --- | --- |'
            printf '| GLIDELINGO_MACOS_CERTIFICATE_SECRET_VERSION | projects/%s/secrets/glidelingo-desktop-macos-certificate-base64/versions/%s |\n' "${GCP_PROJECT_ID}" "${MACOS_CERTIFICATE_VERSION}"
            printf '| GLIDELINGO_MACOS_CERTIFICATE_PASSWORD_SECRET_VERSION | projects/%s/secrets/glidelingo-desktop-macos-certificate-password/versions/%s |\n' "${GCP_PROJECT_ID}" "${MACOS_CERTIFICATE_PASSWORD_VERSION}"
            printf '| GLIDELINGO_APPLE_ID_SECRET_VERSION | projects/%s/secrets/glidelingo-desktop-apple-id/versions/%s |\n' "${GCP_PROJECT_ID}" "${APPLE_ID_VERSION}"
            printf '| GLIDELINGO_APPLE_APP_SPECIFIC_PASSWORD_SECRET_VERSION | projects/%s/secrets/glidelingo-desktop-apple-app-specific-password/versions/%s |\n' "${GCP_PROJECT_ID}" "${APPLE_APP_SPECIFIC_PASSWORD_VERSION}"
            printf '| GLIDELINGO_APPLE_TEAM_ID_SECRET_VERSION | projects/%s/secrets/glidelingo-desktop-apple-team-id/versions/%s |\n' "${GCP_PROJECT_ID}" "${APPLE_TEAM_ID_VERSION}"
            echo
            echo 'Do not delete the legacy GitHub secrets until a GCP-sourced signed and notarized draft succeeds.'
          } >> "${GITHUB_STEP_SUMMARY}"
