name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Expo and Electron
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run doctor
      - run: npm run desktop:export

  backend:
    name: FastAPI and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: glidelingo
          POSTGRES_PASSWORD: ci_only
          POSTGRES_USER: glidelingo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glidelingo -d glidelingo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      GLIDELINGO_DATABASE_URL: postgresql+psycopg://glidelingo:ci_only@localhost:5432/glidelingo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
          working-directory: backend
      - run: npm run setup:backend
      - run: npm run api:verify
      - run: npm run api:test:integration
      - run: npm run db:config
      - name: Build and smoke the production API container
        shell: bash
        run: |
          set -euo pipefail
          image="glidelingo-api:verify"
          docker build --file backend/Dockerfile --tag "${image}" .
          container_id="$(docker run --detach --network host \
            --env GLIDELINGO_DATABASE_URL="${GLIDELINGO_DATABASE_URL}" \
            "${image}")"
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect --format='{{.Config.User}}' "${container_id}")" = "glidelingo"
          curl --fail --retry 6 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/health/live
          curl --fail --retry 6 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/health/ready
          tutor_payload='{"conversation_id":"00000000-0000-4000-8000-000000000001","lesson_id":"el-letters-1","visible_step_index":2,"selected_choice":null,"message":"Why does this sound like ee?","history":[]}'
          unauthorized_response="$(curl --silent --show-error \
            --header 'Content-Type: application/json' \
            --request POST \
            --data "${tutor_payload}" \
            --write-out $'\n%{http_code}' \
            http://127.0.0.1:8080/v1/lesson-tutor/turns)"
          test "${unauthorized_response##*$'\n'}" = "401"
          jq --exit-status '.detail == "Authentication credentials are invalid."' \
            <<< "${unauthorized_response%$'\n'*}"

          docker run --rm --interactive "${image}" python - <<'PY'
          from fastapi.testclient import TestClient

          from app.auth.clerk import ClerkPrincipal
          from app.core.config import Settings
          from app.main import create_app
          from app.modules.lesson_tutor.guard import GuardAdmission
          from app.modules.lesson_tutor.schemas import LessonTutorTurnResponse
          from app.modules.lesson_tutor.service import LessonTutorService


          class FakeGateway:
              def __init__(self) -> None:
                  self.calls = 0

              async def turn(self, request, *, request_id):
                  self.calls += 1
                  assert request.actor_ref.startswith("tusr_v1_")
                  assert not hasattr(request, "conversation_id")
                  return LessonTutorTurnResponse(
                      reply="The ι sound is close to the ee in see.",
                      prompt_version="lesson-tutor-v1",
                  )

              async def close(self):
                  return None


          class FakeGuard:
              def admit(self, *, turn_ref, **_kwargs):
                  return GuardAdmission(turn_ref=turn_ref)

              def complete(self, **_kwargs):
                  return None

              def fail(self, **_kwargs):
                  return None


          class FakeVerifier:
              def verify(self, token: str) -> ClerkPrincipal:
                  assert token == "container-smoke-token"
                  return ClerkPrincipal(
                      user_id="container-smoke-user",
                      issuer="https://clerk.container.test",
                  )


          class FakeBillingService:
              def __init__(self) -> None:
                  self.calls = 0

              async def require_pro(self, *, principal: ClerkPrincipal):
                  self.calls += 1
                  assert principal.user_id == "container-smoke-user"


          gateway = FakeGateway()
          billing_service = FakeBillingService()
          service = LessonTutorService(
              enabled=True,
              gateway=gateway,
              guard=FakeGuard(),
              pseudonym_key=b"container-smoke-key-at-least-32-bytes",
          )
          application = create_app(
              Settings(_env_file=None),
              lesson_tutor_service=service,
              billing_service=billing_service,
          )
          application.state.clerk_token_verifier = FakeVerifier()
          payload = {
              "conversation_id": "00000000-0000-4000-8000-000000000001",
              "lesson_id": "el-letters-1",
              "visible_step_index": 2,
              "selected_choice": None,
              "message": "Why does this sound like ee?",
              "history": [],
          }
          with TestClient(application) as client:
              response = client.post(
                  "/v1/lesson-tutor/turns",
                  json=payload,
                  headers={
                      "Authorization": "Bearer container-smoke-token",
                      "Idempotency-Key": "container-smoke-turn-0001",
                  },
              )
          assert response.status_code == 200, response.text
          assert response.json()["prompt_version"] == "lesson-tutor-v1"
          assert billing_service.calls == 1
          assert gateway.calls == 1
          PY

      - name: Verify private tutor and production container
        run: |
          npm run setup:tutor
          npm run tutor:verify
          image="glidelingo-tutor:verify"
          docker build --file services/lesson-tutor/Dockerfile --tag "${image}" .
          docker run --rm --interactive "${image}" python - <<'PY'
          from pathlib import Path

          from app.core.config import Settings
          from app.modules.lesson_tutor.context import load_lesson_context

          settings = Settings(_env_file=None)
          assert settings.content_root == Path("/app/content")
          context = load_lesson_context(
              content_root=settings.content_root,
              lesson_id="el-letters-1",
              visible_step_index=2,
              selected_choice=None,
          )
          assert context.lesson_id == "el-letters-1"
          PY
          container_id="$(docker run --detach --network host --env PORT=8082 "${image}")"
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect --format='{{.Config.User}}' "${container_id}")" = "glidelingo"
          curl --fail --retry 6 --retry-all-errors --retry-delay 2 http://127.0.0.1:8082/health/live
          tutor_payload='{"actor_ref":"tusr_v1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","turn_ref":"00000000-0000-4000-8000-000000000001","lesson_id":"el-letters-1","visible_step_index":2,"selected_choice":null,"message":"Why does this sound like ee?","history":[]}'
          disabled="$(curl --silent --show-error --header 'Content-Type: application/json' \
            --request POST --data "${tutor_payload}" --write-out $'\n%{http_code}' \
            http://127.0.0.1:8082/internal/v1/lesson-tutor/turns)"
          test "${disabled##*$'\n'}" = "503"

  infrastructure:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/gcp/environments/development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.9
      - run: terraform fmt -check
      - run: terraform init -backend=false -lockfile=readonly
      - run: terraform validate
