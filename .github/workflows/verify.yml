name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Expo and Electron
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run doctor
      - run: npm run desktop:export

  backend:
    name: FastAPI and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: glidelingo
          POSTGRES_PASSWORD: ci_only
          POSTGRES_USER: glidelingo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glidelingo -d glidelingo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      GLIDELINGO_DATABASE_URL: postgresql+psycopg://glidelingo:ci_only@localhost:5432/glidelingo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
          working-directory: backend
      - run: npm run setup:backend
      - run: npm run api:verify
      - run: npm run api:test:integration
      - run: npm run db:config
      - name: Build and smoke the production API container
        shell: bash
        run: |
          set -euo pipefail
          image="glidelingo-api:verify"
          docker build --tag "${image}" backend
          container_id="$(docker run --detach --network host \
            --env GLIDELINGO_DATABASE_URL="${GLIDELINGO_DATABASE_URL}" \
            "${image}")"
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect --format='{{.Config.User}}' "${container_id}")" = "glidelingo"
          curl --fail --retry 6 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/health/live
          curl --fail --retry 6 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/health/ready

  infrastructure:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/gcp/environments/development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.9
      - run: terraform fmt -check
      - run: terraform init -backend=false -lockfile=readonly
      - run: terraform validate
