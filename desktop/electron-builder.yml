appId: com.stefanoscodes.glidelingo
productName: GlideLingo
electronVersion: 44.0.0
asar: true
npmRebuild: false

directories:
  output: ../release

files:
  - main.cjs
  - runtime.cjs
  - package.json

extraResources:
  - from: ../dist
    to: dist

protocols:
  - name: GlideLingo authentication callback
    schemes:
      - glidelingo

mac:
  category: public.app-category.education
  icon: ../assets/images/icon.png
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  icon: ../assets/images/icon.png
  target: nsis
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
