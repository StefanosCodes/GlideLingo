appId: com.stefanoscodes.glidelingo
productName: GlideLingo
electronVersion: 44.0.0
asar: true
npmRebuild: false
afterSign: ./desktop/after-sign.cjs

directories:
  output: ../release

files:
  - main.cjs
  - runtime.cjs
  - updater.cjs
  - package.json

extraResources:
  - from: ../dist
    to: dist

protocols:
  - name: GlideLingo authentication callback
    schemes:
      - glidelingo

publish:
  provider: github
  owner: StefanosCodes
  repo: GlideLingo

mac:
  category: public.app-category.education
  hardenedRuntime: true
  icon: ../assets/images/desktop-icon.png
  notarize: false
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  icon: ../assets/images/icon.png
  target: nsis
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
