name: glidelingo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: glidelingo
      POSTGRES_PASSWORD: ${GLIDELINGO_DB_PASSWORD:-glidelingo_dev_only}
      POSTGRES_USER: glidelingo
    ports:
      - "127.0.0.1:${GLIDELINGO_DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glidelingo -d glidelingo"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    volumes:
      - glidelingo_postgres_data:/var/lib/postgresql/data

volumes:
  glidelingo_postgres_data:
