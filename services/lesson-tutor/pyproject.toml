[project]
name = "glidelingo-lesson-tutor"
version = "0.1.0"
description = "IAM-private GlideLingo lesson tutor service"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.116,<1",
  "openai-agents>=0.22.0",
  "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = ["live_agent: requires explicit tutor flags and a live OPENAI_API_KEY"]
